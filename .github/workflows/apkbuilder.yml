# ملف مُولَّد تلقائياً بواسطة ApkBuilder (Android (Gradle)) — يُستبدل عند كل بناء، لا تعدّله يدوياً.
name: ApkBuilder
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 'تنزيل الكود'
        uses: actions/checkout@v4
      - name: 'إعداد Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 'تجهيز Android SDK'
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          LIC='\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n'
          sudo mkdir -p "$SDK/licenses"
          printf "$LIC" | sudo tee "$SDK/licenses/android-sdk-license" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: 'إعداد Gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 'بناء APK'
        working-directory: 'project/'
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
      - name: 'رفع ملف APK'
        uses: actions/upload-artifact@v4
        with:
          name: 'apk'
          path: 'project//**/build/outputs/apk/**/*.apk'
          if-no-files-found: 'error'
