name: Build APK from ZIP

# Usage:
#   1. Put this file in your repo at:  .github/workflows/build.yml
#   2. Upload ImageToVector.zip (or any .zip of the project) to the repo root.
#   3. Push -> Actions tab -> download the APK from "Artifacts".

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repo root. Upload ImageToVector.zip next to .github/"
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf _build
          mkdir _build
          unzip -q -o "$ZIP" -d _build
          # find the folder that really contains the Gradle project (handles zips with a wrapper folder)
          SETTINGS=$(find _build -maxdepth 3 -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found inside the zip"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show error details
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: grep -n -B1 -A6 -E "Dependency|requires|issues were found|error:|e: " build.log | head -150 || true

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk out/
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToVector-apk
          path: out/*.apk
