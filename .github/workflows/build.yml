name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # أول مرة: يفك ضغط ChatApp.zip وينقل google-services.json لمكانه
      - name: Prepare project
        run: |
          if [ -f ChatApp.zip ]; then unzip -o ChatApp.zip && rm ChatApp.zip; fi
          if [ -f google-services.json ] && [ -d app ]; then mv google-services.json app/google-services.json; fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Setup project"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
